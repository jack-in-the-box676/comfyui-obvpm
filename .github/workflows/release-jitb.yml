name: Release JITB version

on:
  push:
    tags:
      - "v*-jitb.*"

permissions:
  contents: write

jobs:
  release:
    name: Create JITB GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          tag = os.environ["TAG"]
          changelog = Path("CHANGELOG-JITB.md").read_text(encoding="utf-8")

          pattern = (
              rf"^## {re.escape(tag)}\s*$"
              rf"(.*?)"
              rf"(?=^## |\Z)"
          )

          match = re.search(pattern, changelog, flags=re.MULTILINE | re.DOTALL)

          if not match:
              print(
                  f"CHANGELOG-JITB.md has no section for {tag}",
                  file=sys.stderr,
              )
              sys.exit(1)

          notes = match.group(1).strip()

          if not notes:
              print(
                  f"CHANGELOG-JITB.md section for {tag} is empty",
                  file=sys.stderr,
              )
              sys.exit(1)

          Path("notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md \
            --verify-tag